---
galaxy_info:
  role_name: bind
  namespace: brlin-tw
  author: 林博仁(Buo-ren Lin)
  description: >
    Sets up ISC BIND as an authoritative DNS server for one or more domains
    (primary and/or secondary).

    This role is a fork of the (development stalled as of 2026/10/4) [bertvv.bind](https://galaxy.ansible.com/bertvv/bind) role, incorporating various improvements and customizations, specifically:

    - (Partially) incorporated fixes to the following issues and pull requests:
      - [Eliminate dnssec-enable option for bind version 9.16 and newer. Fix #192 by docsvt · Pull Request #208 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/pull/208)
      - [Typo fix (remove UTF8 non-breaking spaces) by rowanthorpe · Pull Request #167 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/pull/167)
      - [Remove unnecessary extra variable by rowanthorpe · Pull Request #168 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/pull/168)
      - [bindkeys-file should no longer be specified in named.conf for recent distro versions · Issue #229 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/issues/229)
      - [Fix incorrect path of bind.keys in Debian by brlin-tw · Pull Request #232 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/pull/232)
      - [Deploy errors with "the 'dnssec-validation yes' option requires configured 'trust-anchors'; consider using 'dnssec-validation auto'" since BIND 9.19.22 · Issue #233 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/issues/233)
      - ["INJECT_FACTS_AS_VARS default to `True` is deprecated, top-level facts will not be auto injected after the change" deprecation warnings · Issue #234 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/issues/234)
    - (Partially) incorporated the following features:
      - [add Debian11 by roumano · Pull Request #203 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/pull/203)
      - Added Debian 13 support, Debian 12 isn't added as no tests have been conducted yet.
      - [Permit a different TTL per DNS Zone by roumano · Pull Request #181 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/pull/181)
      - [Add two RRL variables with zero-defaults config-handling by rowanthorpe · Pull Request #169 · bertvv/ansible-role-bind](https://github.com/bertvv/ansible-role-bind/pull/169)

    If you like/use this role, please consider giving it a star and rating it on the role's [Ansible Galaxy page](https://galaxy.ansible.com/brlin-tw/bind). Thanks!
  license: BSD
  min_ansible_version: 2.7
  platforms:
    - name: ArchLinux
      versions:
        - any
    - name: Debian
      versions:
        - jessie
        - stretch
        - buster
        - bullseye
        - trixie
    - name: FreeBSD
      versions:
        - 12.1
    - name: EL
      versions:
        - 6
        - 7
        - 8
    - name: Ubuntu
      versions:
        - xenial
        - bionic
        - focal
  galaxy_tags:
    - dns
    - networking
    - system
dependencies: []
